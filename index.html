<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e15" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NERVA" />
<title>NERVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;1,6..72,200;1,6..72,300;1,6..72,400&display=swap" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { min-height: 100%; }
body {
  background: #0a0e15;
  color: #e8e3d8;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
button { -webkit-tap-highlight-color: transparent; user-select: none; }
textarea { font-family: inherit; }
.cc-scroll { scrollbar-width: none; -ms-overflow-style: none; }
.cc-scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
@keyframes ccInR  { from { opacity: 0; transform: translateX(34px);  } to { opacity: 1; transform: none; } }
@keyframes ccInL  { from { opacity: 0; transform: translateX(-34px); } to { opacity: 1; transform: none; } }
@keyframes ccInUp { from { opacity: 0; transform: translateY(42px);  } to { opacity: 1; transform: none; } }
@keyframes ccFlip { from { opacity: 0; transform: rotateY(-78deg);   } to { opacity: 1; transform: rotateY(0deg); } }
::selection { background: #4cc9f0; color: #0a0e15; }

/* Range sliders (Adjust sheet) */
input[type=range] {
  -webkit-appearance: none; appearance: none;
  background: transparent; cursor: pointer; outline: none;
  touch-action: manipulation; width: 100%;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 4px;
  background: linear-gradient(180deg, rgba(232,227,216,0.05), rgba(232,227,216,0.15));
  border: 1px solid rgba(232,227,216,0.08); border-radius: 2px;
}
input[type=range]::-moz-range-track {
  height: 4px; background: rgba(232,227,216,0.10);
  border: 1px solid rgba(232,227,216,0.08); border-radius: 2px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; background: #11161f;
  border: 2.5px solid currentColor; border-radius: 50%; margin-top: -10px; cursor: grab;
  box-shadow: 0 0 0 1px rgba(10,14,21,0.9), 0 0 8px rgba(0,0,0,0.5), inset 0 0 0 2.5px #11161f;
}
input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; background: #11161f;
  border: 2.5px solid currentColor; border-radius: 50%; cursor: grab;
  box-shadow: 0 0 0 1px rgba(10,14,21,0.9), 0 0 8px rgba(0,0,0,0.5);
}
@media (pointer: fine) {
  input[type=range]::-webkit-slider-thumb { width: 17px; height: 17px; margin-top: -7.5px; }
  input[type=range]::-moz-range-thumb     { width: 17px; height: 17px; }
}
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#0a0e15"/>
  <rect x="30" y="22" width="40" height="56" rx="6" fill="#11161f" stroke="#4cc9f0" stroke-width="1.5"/>
  <text x="50" y="46" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#3ddc97">Go</text>
  <rect x="38" y="56" width="24" height="3" rx="1.5" fill="#4cc9f0"/>
  <rect x="38" y="62" width="16" height="3" rx="1.5" fill="#ff9a3c"/>
</svg>
</template>

<!-- Capacitor bridge (injected by native container; no-op on web) -->
<script src="https://unpkg.com/@capacitor/core@6/dist/capacitor.js" crossorigin="anonymous" onerror="console.log('cap bridge not available — web preview')"></script>

<!-- Shared tokens + helpers, storage, sync, safety gate (plain JS; load before React) -->
<script src="nerva-ui-shared.js"></script>
<script src="nerva-storage.js"></script>
<script src="nerva-sync-stub.js"></script>
<script src="nerva-safety.js"></script>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
  crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
  crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
  crossorigin="anonymous"></script>

<!-- Tweaks shell (after React, before app) -->
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- Evaluation kernel (black box — do not modify) -->
<script type="text/babel" src="nerva-v11-core.jsx"></script>

<!-- Swipeable Checkpoint instrument -->
<script type="text/babel" src="checkpoint-card.jsx"></script>

<!-- Vercel Analytics (free, no account needed — enable in Vercel dashboard → Analytics) -->
<script defer src="/_vercel/insights/script.js"></script>

<!-- Mobile app shell -->
<script type="text/babel" src="nerva-app.jsx"></script>

<!-- Mount -->
<script type="text/babel" data-presets="env,react">
  const { NervaV11Provider, NervaApp } = window;
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(NervaV11Provider, null,
      React.createElement(NervaApp)
    )
  );
</script>
</body>
</html>
